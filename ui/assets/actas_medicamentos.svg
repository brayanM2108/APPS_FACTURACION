<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 256 256">

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5"
                          flood-color="#000927"
                          flood-opacity="0.10"/>
        </filter>
    </defs>



    <!-- Documento principal -->
    <g filter="url(#shadow)">
        <rect
                x="60"
                y="45"
                width="110"
                height="150"
                rx="18"
                fill="#FFFFFF"
                stroke="#E2E8F0"
                stroke-width="2"/>

        <!-- Encabezado -->
        <rect
                x="60"
                y="45"
                width="110"
                height="28"
                rx="18"
                fill="#000927"/>

        <!-- Líneas -->
        <rect x="80" y="90" width="70" height="6" rx="3"
              fill="#CBD5E1"/>

        <rect x="80" y="108" width="52" height="6" rx="3"
              fill="#CBD5E1"/>

        <rect x="80" y="126" width="64" height="6" rx="3"
              fill="#CBD5E1"/>

        <rect x="80" y="144" width="46" height="6" rx="3"
              fill="#CBD5E1"/>
    </g>

    <!-- Cápsula medicamento -->
    <g filter="url(#shadow)">
        <g transform="translate(155,140) rotate(-25)">
            <rect
                    x="-24"
                    y="-10"
                    width="48"
                    height="20"
                    rx="10"
                    fill="#F97838"/>

            <rect
                    x="0"
                    y="-10"
                    width="24"
                    height="20"
                    rx="10"
                    fill="#1565C0"/>

            <line
                    x1="0"
                    y1="-10"
                    x2="0"
                    y2="10"
                    stroke="#FFFFFF"
                    stroke-width="2"/>
        </g>
    </g>

    <!-- Sello aprobado -->
    <g filter="url(#shadow)">
        <circle
                cx="185"
                cy="85"
                r="24"
                fill="#22C55E"/>

        <path
                d="M176 85
               L183 92
               L195 79"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"/>
    </g>

    <!-- Firma -->
    <path
            d="M90 172
           C100 162,
             108 182,
             120 172
           C128 165,
             136 180,
             148 170"
            fill="none"
            stroke="#1565C0"
            stroke-width="3"
            stroke-linecap="round"/>

</svg>