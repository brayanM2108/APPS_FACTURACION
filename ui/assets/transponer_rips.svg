<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 256 256">

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                    dx="0"
                    dy="4"
                    stdDeviation="6"
                    flood-color="#000927"
                    flood-opacity="0.10"/>
        </filter>
    </defs>



    <!-- Todo el contenido escalado y centrado -->
    <g transform="translate(128 128) scale(0.88) translate(-128 -128)">

        <!-- Documento origen -->
        <g filter="url(#shadow)">
            <rect
                    x="50"
                    y="76"
                    width="72"
                    height="96"
                    rx="12"
                    fill="#FFFFFF"
                    stroke="#E2E8F0"
                    stroke-width="2"/>

            <rect x="65" y="101" width="42" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="65" y="118" width="30" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="65" y="135" width="36" height="6" rx="3" fill="#CBD5E1"/>
        </g>

        <!-- Flecha transformación -->
        <g>
            <path
                    d="M125 124 H145"
                    stroke="#F97838"
                    stroke-width="6"
                    stroke-linecap="round"/>

            <path
                    d="M136 114 L148 124 L136 134"
                    fill="none"
                    stroke="#F97838"
                    stroke-width="6"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
        </g>

        <!-- Icono transformación -->
        <g filter="url(#shadow)">
            <circle
                    cx="128"
                    cy="82"
                    r="22"
                    fill="#1565C0"/>

            <path
                    d="M120 82
                   A8 8 0 0 1 136 82"
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="3"/>

            <path
                    d="M133 75 L138 82 L130 83"
                    fill="#FFFFFF"/>

            <path
                    d="M136 82
                   A8 8 0 0 1 120 82"
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="3"/>

            <path
                    d="M123 89 L118 82 L126 81"
                    fill="#FFFFFF"/>
        </g>

        <!-- Clipboard destino -->
        <g filter="url(#shadow)">
            <rect
                    x="145"
                    y="54"
                    width="72"
                    height="118"
                    rx="14"
                    fill="#FFFFFF"
                    stroke="#E2E8F0"
                    stroke-width="2"/>

            <rect
                    x="167"
                    y="42"
                    width="28"
                    height="18"
                    rx="7"
                    fill="#1565C0"/>

            <rect x="161" y="88" width="40" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="161" y="104" width="32" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="161" y="120" width="36" height="6" rx="3" fill="#CBD5E1"/>

            <!-- Check -->
            <circle
                    cx="181"
                    cy="151"
                    r="15"
                    fill="#22C55E"/>

            <path
                    d="M175 151 L180 156 L188 146"
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
        </g>

    </g>

</svg>