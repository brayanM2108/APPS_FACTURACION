<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 256 256">

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                    dx="0"
                    dy="4"
                    stdDeviation="5"
                    flood-color="#000927"
                    flood-opacity="0.10"/>
        </filter>
    </defs>



    <!-- Escalado general -->
    <g transform="translate(128 128) scale(0.92) translate(-128 -128)">

        <!-- PDF origen -->
        <g filter="url(#shadow)">
            <rect
                    x="42"
                    y="82"
                    width="58"
                    height="78"
                    rx="12"
                    fill="#FFFFFF"
                    stroke="#E2E8F0"
                    stroke-width="2"/>

            <rect
                    x="56"
                    y="100"
                    width="30"
                    height="14"
                    rx="4"
                    fill="#F97838"/>

            <text
                    x="71"
                    y="109"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-size="7"
                    font-weight="bold"
                    fill="#FFFFFF">PDF</text>

            <rect
                    x="56"
                    y="126"
                    width="26"
                    height="4"
                    rx="2"
                    fill="#CBD5E1"/>

            <rect
                    x="56"
                    y="136"
                    width="22"
                    height="4"
                    rx="2"
                    fill="#CBD5E1"/>
        </g>

        <!-- Flecha entrada -->

        <g
                stroke="#F97838"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none">

            <path d="M102 121 H114"/>
            <path d="M108 113 L118 121 L108 129"/>

        </g>

        <!-- Nodo compresión -->
        <g filter="url(#shadow)">

            <!-- Nodo compresión -->
            <circle
                    cx="145"
                    cy="121"
                    r="24"
                    fill="#1565C0"/>

            <!-- Flechas hacia centro -->
            <path
                    d="M130 111 L136 117"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"/>

            <path
                    d="M150 111 L144 117"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"/>

            <path
                    d="M130 131 L136 125"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"/>

            <path
                    d="M150 131 L144 125"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"/>

            <circle
                    cx="140"
                    cy="121"
                    r="4"
                    fill="#FFFFFF"/>

        </g>

        <!-- Flecha salida -->
        <g
                stroke="#F97838"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none">

            <path d="M169 121 H183"/>
            <path d="M175 113 L185 121 L175 129"/>

        </g>

        <!-- PDF comprimido -->
        <g filter="url(#shadow)">

            <rect
                    x="182"
                    y="95"
                    width="42"
                    height="58"
                    rx="10"
                    fill="#FFFFFF"
                    stroke="#E2E8F0"
                    stroke-width="2"/>

            <rect
                    x="192"
                    y="109"
                    width="22"
                    height="12"
                    rx="4"
                    fill="#1565C0"/>

            <text
                    x="203"
                    y="117"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-size="6"
                    font-weight="bold"
                    fill="#FFFFFF">PDF</text>

            <rect
                    x="192"
                    y="129"
                    width="16"
                    height="4"
                    rx="2"
                    fill="#CBD5E1"/>

            <rect
                    x="192"
                    y="137"
                    width="12"
                    height="4"
                    rx="2"
                    fill="#CBD5E1"/>

        </g>

        <!-- Indicador ahorro -->
        <g filter="url(#shadow)">

            <circle
                    cx="198"
                    cy="175"
                    r="16"
                    fill="#22C55E"/>

            <path
                    d="M198 166 V178"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"/>

            <path
                    d="M193 173 L198 178 L203 173"
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

        </g>

