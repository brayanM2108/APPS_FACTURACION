<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 256 256">

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5"
                          flood-color="#000927"
                          flood-opacity="0.10"/>
        </filter>
    </defs>



    <!-- PDFs origen -->
    <g filter="url(#shadow)">

        <rect
                x="40"
                y="70"
                width="42"
                height="54"
                rx="8"
                fill="#FFFFFF"
                stroke="#E2E8F0"
                stroke-width="2"/>

        <rect
                x="40"
                y="105"
                width="42"
                height="54"
                rx="8"
                fill="#FFFFFF"
                stroke="#E2E8F0"
                stroke-width="2"/>

        <rect
                x="40"
                y="140"
                width="42"
                height="54"
                rx="8"
                fill="#FFFFFF"
                stroke="#E2E8F0"
                stroke-width="2"/>

        <!-- Etiquetas PDF -->
        <rect x="50" y="88" width="22" height="12"
              rx="4" fill="#F97838"/>

        <rect x="50" y="123" width="22" height="12"
              rx="4" fill="#F97838"/>

        <rect x="50" y="158" width="22" height="12"
              rx="4" fill="#F97838"/>

        <text x="61" y="97"
              text-anchor="middle"
              font-size="7"
              font-weight="bold"
              fill="#FFFFFF">PDF</text>

        <text x="61" y="132"
              text-anchor="middle"
              font-size="7"
              font-weight="bold"
              fill="#FFFFFF">PDF</text>

        <text x="61" y="167"
              text-anchor="middle"
              font-size="7"
              font-weight="bold"
              fill="#FFFFFF">PDF</text>

    </g>

    <!-- Flechas convergentes -->
    <g
            stroke="#F97838"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none">

        <path d="M90 97 L120 115"/>
        <path d="M90 132 L120 132"/>
        <path d="M90 167 L120 149"/>

    </g>

    <!-- Nodo de unión -->
    <g filter="url(#shadow)">
        <circle
                cx="132"
                cy="132"
                r="24"
                fill="#1565C0"/>

        <path
                d="M122 132H142
               M132 122V142"
                stroke="#FFFFFF"
                stroke-width="4"
                stroke-linecap="round"/>
    </g>

    <!-- Flecha resultado -->
    <g
            stroke="#F97838"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none">

        <path d="M156 132 H182"/>

        <path d="M174 122 L186 132 L174 142"/>
    </g>

    <!-- PDF final -->
    <g filter="url(#shadow)">

        <rect
                x="185"
                y="82"
                width="42"
                height="60"
                rx="10"
                fill="#FFFFFF"
                stroke="#E2E8F0"
                stroke-width="2"/>

        <rect
                x="194"
                y="100"
                width="24"
                height="14"
                rx="4"
                fill="#1565C0"/>

        <text x="206"
              y="110"
              text-anchor="middle"
              font-size="7"
              font-weight="bold"
              fill="#FFFFFF">PDF</text>

        <rect x="194" y="122"
              width="20"
              height="4"
              rx="2"
              fill="#CBD5E1"/>

        <rect x="194" y="130"
              width="16"
              height="4"
              rx="2"
              fill="#CBD5E1"/>

    </g>

    <!-- Check éxito -->
    <g filter="url(#shadow)">
        <circle
                cx="212"
                cy="170"
                r="16"
                fill="#22C55E"/>

        <path
                d="M206 170
               L211 175
               L219 166"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"/>
    </g>

</svg>